name: desktop

# Builds the desktop app (Windows installer + portable .exe, macOS .dmg, Linux
# AppImage) on every push to main and publishes it as the latest GitHub
# release. Installed apps update themselves from it (desktop/updater.cjs), so
# each release gets a higher version: <major>.<minor> from
# desktop/package.json plus the workflow run number.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          base=$(node -p "require('./desktop/package.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              desktop/release/Basalt-Setup.exe
              desktop/release/Basalt-Setup.exe.blockmap
              desktop/release/Basalt-Portable.exe
              desktop/release/latest.yml
          - os: macos-latest
            target: mac
            files: desktop/release/Basalt-mac.dmg
          - os: ubuntu-latest
            target: linux
            files: |
              desktop/release/Basalt-x86_64.AppImage
              desktop/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build ${{ matrix.target }} app ${{ needs.version.outputs.version }}
        working-directory: desktop
        shell: bash
        run: npm run dist:${{ matrix.target }} -- --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Check the Claude connector runs through the app
        working-directory: desktop
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          case "${{ matrix.target }}" in
            win) exe=release/win-unpacked/Basalt.exe ;;
            mac) exe=$(ls -d release/mac*/Basalt.app/Contents/MacOS/Basalt | head -1) ;;
            linux) exe=release/linux-unpacked/basalt-desktop ;;
          esac
          "$exe" app/mcp.cjs --help 2>&1 | tee connector-help.txt
          grep -q "Basalt MCP server" connector-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # Only publish when every platform built, so the update manifests always match.
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la out
          cat > notes.md <<'NOTES'
          **Windows:** `Basalt-Setup.exe` installs Basalt and keeps it updated automatically. `Basalt-Portable.exe` runs without installing (it tells you when there's a new version).
          Windows may say *"Windows protected your PC"* because the app isn't code-signed → **More info → Run anyway**. Allow Basalt on **private networks** so devices on your Wi-Fi can sync.

          **Mac:** open `Basalt-mac.dmg` and drag Basalt to Applications; the first time, right-click Basalt → **Open**. Basalt tells you when a new version is out.

          **Linux:** `chmod +x Basalt-x86_64.AppImage` and run it — it updates itself.
          NOTES
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --latest --title "Basalt $VERSION" --notes-file notes.md
          # Keep the five newest releases (older ones only served updates from those versions).
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
